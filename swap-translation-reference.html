<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>swap · 翻译对照表</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tdesign-vue-next@1.20.8/dist/tdesign.min.css"
      onerror="this.onerror=null;this.href='https://unpkg.com/tdesign-vue-next@1.20.8/dist/tdesign.min.css'">
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js'"></script>
<script src="https://cdn.jsdelivr.net/npm/tdesign-vue-next@1.20.8/dist/tdesign.min.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/tdesign-vue-next@1.20.8/dist/tdesign.min.js'"></script>
<style>
:root{--fg:#111;--sub:#6b7280;--bd:#e5e7eb;--accent:#2B3F5F;--danger:#DC2626;--warn-bg:#FFF7E0;--warn-bd:#F0D68A}
*{box-sizing:border-box}
body{margin:0;background:#F6F7F9;color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans Thai',sans-serif}
[v-cloak]{display:none}
.hd{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--bd);padding:12px 20px}
.hd-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.hd h1{margin:0;font-size:16px;font-weight:600}
.hd .meta{font-size:12px;color:var(--sub)}
.hd-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}
.hd-tools .qbox{flex:1 1 340px;max-width:600px}
.hd-tools .hit{font-size:12px;color:var(--accent);white-space:nowrap;min-height:18px}
main{padding:14px 20px 48px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 2px 10px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.tip{background:#fff;border:1px solid var(--bd);border-left:3px solid var(--danger);border-radius:8px;
  padding:12px 14px;color:var(--danger);font-size:13px}
.tip code{background:#F6F7F9;padding:1px 5px;border-radius:4px;color:#374151}
.cell{white-space:pre-wrap;word-break:break-word}
.cell.miss{color:var(--danger)}
.cell.same{background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn-bd);border-radius:3px}
mark{background:#FFE58F;padding:0 1px;border-radius:2px}
.tbl .t-table__body td,.tbl .t-table__header th{padding:7px 10px}
.tbl .t-table__body td:first-child,.tbl .t-table__header th:first-child{color:#9ca3af}
</style>
</head>
<body>

<div id="app" v-cloak></div>

<script type="text/x-template" id="app-tpl">
<div class="wrap">
  <header class="hd">
    <div class="hd-row">
      <h1>{{ dir }} · 翻译对照表</h1>
      <div class="meta">{{ statsText }}</div>
    </div>
    <div class="hd-tools">
      <t-input ref="qbox" class="qbox" v-model="q" clearable
               placeholder="搜索译文：输入关键词，多个关键词用空格分隔（/ 聚焦，Esc 清空）"></t-input>
      <span class="hit">{{ q && !loading ? '命中 ' + view.length + ' 条' : '' }}</span>
    </div>
  </header>

  <main>
    <div class="legend">
      <span><i style="background:#FFF7E0;border:1px solid #F0D68A"></i>与中文相同（疑未翻译）</span>
      <span><i style="background:#fff;border:1px solid #DC2626"></i>缺失 / 空值</span>
      <span>表格右上角「列配置」可切换语言列</span>
    </div>

    <div class="tip" v-if="error">
      <div>{{ error }}</div>
      <div style="margin-top:6px">本页通过 fetch 读取 <code>locales/{{ dir }}/*.json</code>，请用 http(s) 访问：仓库根目录执行
        <code>python -m http.server 8000</code>，再打开 <code>http://localhost:8000/{{ dir }}-translation-reference.html</code>。</div>
    </div>

    <t-table v-show="!error" class="tbl" ref="tbl"
             row-key="__key"
             :data="view"
             :columns="columns"
             :column-controller="columnController"
             :locale="tblLocale"
             :loading="loading"
             :hover="true"
             :bordered="false"
             size="small"
             @display-columns-change="onDisplayColumnsChange">
      <template #empty>
        <div style="padding:32px 0;color:#6b7280">{{ loading ? '加载中…' : '该目录暂无词条（0 条）' }}</div>
      </template>
    </t-table>
  </main>
</div>
</script>

<script>window.__I18N_REF__ = {"dir":"swap","src":"zh-CN","langs":[{"code":"zh-CN","label":"简体中文（源）","source":true},{"code":"en","label":"English","source":false},{"code":"id","label":"Bahasa Indonesia","source":false},{"code":"th","label":"ไทย","source":false},{"code":"zh-HK","label":"繁體中文（香港）","source":false}],"hideable":["en","id","th","zh-HK"]};</script>
<script>
/* i18n 翻译对照表 · 页面运行时（由 scripts/i18n_reference.mjs 内联进产物）
   读取 window.__I18N_REF__ = { dir, langs:[{code,label,source}], hideable:[code], src } */
(function () {
  var CFG = window.__I18N_REF__ || {};
  var DIR = CFG.dir;
  var LANGS = CFG.langs || [];
  var HIDEABLE = CFG.hideable || [];
  var SRC = CFG.src;

  function esc(s) {
    return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;');
  }

  /* 无正则高亮：每轮取最早出现的 token 切段，规避转义/回溯问题 */
  function highlight(raw, toks) {
    var low = raw.toLowerCase();
    var out = [];
    var i = 0;
    while (i < raw.length) {
      var at = -1;
      var len = 0;
      for (var t = 0; t < toks.length; t++) {
        var idx = low.indexOf(toks[t], i);
        if (idx >= 0 && (at < 0 || idx < at)) { at = idx; len = toks[t].length; }
      }
      if (at < 0) { out.push(esc(raw.slice(i))); break; }
      if (at > i) out.push(esc(raw.slice(i, at)));
      out.push('<mark>' + esc(raw.slice(at, at + len)) + '</mark>');
      i = at + len;
    }
    return out.join('');
  }

  /* 嵌套 JSON → 点路径扁平化（与 scripts/i18n_check.mjs 同口径） */
  function flatten(o, prefix, out) {
    for (var k in o) {
      if (!Object.prototype.hasOwnProperty.call(o, k)) continue;
      var v = o[k];
      var n = prefix ? prefix + '.' + k : k;
      if (v && typeof v === 'object' && !Array.isArray(v)) flatten(v, n, out);
      else out[n] = v === null || v === undefined ? '' : String(v);
    }
    return out;
  }

  function cellOf(row, code, toks) {
    var raw = row[code];
    var cls = 'cell';
    var tip = '';
    var html;
    if (raw === undefined) {
      cls += ' miss'; tip = '该语言缺少此词条'; html = '— 缺失 —';
    } else if (raw === '') {
      cls += ' miss'; tip = '该语言此词条为空值'; html = '（空）';
    } else if (code !== SRC && raw === row[SRC]) {
      cls += ' same'; tip = '与中文相同：疑未翻译，请确认';
      html = toks.length ? highlight(raw, toks) : esc(raw);
    } else {
      html = toks.length ? highlight(raw, toks) : esc(raw);
    }
    return { cls: cls, tip: tip, html: html };
  }

  function buildColumns(toks) {
    var cols = [{ colKey: 'serial-number', title: '#', width: 64, align: 'right' }];
    LANGS.forEach(function (l) {
      cols.push({
        colKey: l.code,
        title: l.label,
        cell: function (h, params) {
          var c = cellOf(params.row, l.code, toks);
          /* Vue 3 直接给 innerHTML（Vue 2 的 domProps 在这里无效，会渲染成空单元格） */
          return h('span', {
            class: c.cls,
            title: c.tip || undefined,
            innerHTML: c.html
          });
        }
      });
    });
    return cols;
  }

  function statsOf(rows) {
    var total = rows.length;
    var miss = [];
    var same = [];
    LANGS.forEach(function (l) {
      if (l.source) return;
      var m = 0;
      var s = 0;
      rows.forEach(function (r) {
        var v = r[l.code];
        if (v === undefined || v === '') m++;
        else if (v === r[SRC]) s++;
      });
      miss.push(l.code + ' ' + m);
      same.push(l.code + ' ' + s);
    });
    var text = '共 ' + total + ' 条词条';
    if (total) text += ' · 缺失：' + miss.join(' / ') + ' · 与中文相同：' + same.join(' / ');
    return text;
  }

  var app = Vue.createApp({
    template: document.getElementById('app-tpl').innerHTML,
    data: function () {
      return {
        dir: DIR,
        /* 列配置弹窗只保留标题与按钮，去掉「请选择需要在表格中显示的数据列」说明行 */
        tblLocale: { columnConfigDescriptionText: '' },
        loading: true,
        error: '',
        rows: [],
        q: '',
        shown: HIDEABLE.slice(),
        statsText: '加载中…'
      };
    },
    computed: {
      toks: function () {
        var s = String(this.q || '').trim().toLowerCase();
        if (!s) return [];
        var arr = s.split(' ');
        var out = [];
        for (var i = 0; i < arr.length; i++) if (arr[i]) out.push(arr[i]);
        return out;
      },
      /* 搜索范围 = 当前可见的语言列（隐藏的列不参与匹配） */
      shownCodes: function () {
        var codes = [SRC];
        for (var i = 0; i < this.shown.length; i++) {
          var c = this.shown[i];
          if (HIDEABLE.indexOf(c) >= 0 && codes.indexOf(c) < 0) codes.push(c);
        }
        return codes;
      },
      /* 依赖 toks：关键词变化 → 重建列 → 单元格带高亮重渲染 */
      columns: function () {
        return buildColumns(this.toks);
      },
      columnController: function () {
        return { fields: HIDEABLE, placement: 'top-right', displayType: 'auto-width' };
      },
      view: function () {
        var toks = this.toks;
        var codes = this.shownCodes;
        if (!toks.length) return this.rows;
        return this.rows.filter(function (r) {
          for (var t = 0; t < toks.length; t++) {
            var hit = false;
            for (var i = 0; i < codes.length; i++) {
              var v = r[codes[i]];
              if (v !== undefined && String(v).toLowerCase().indexOf(toks[t]) >= 0) { hit = true; break; }
            }
            if (!hit) return false;
          }
          return true;
        });
      }
    },
    methods: {
      onDisplayColumnsChange: function (value) {
        this.shown = Array.isArray(value) ? value.slice() : [];
      },
      fail: function (msg) {
        this.loading = false;
        this.error = msg;
        this.statsText = '加载失败';
      },
      focusSearch: function () {
        var box = this.$refs.qbox;
        if (box && box.focus) box.focus();
      },
      load: function () {
        if (!window.Vue || !window.TDesign) {
          this.fail('前端依赖未加载：CDN 被拦截或断网（需要 vue.global.prod.js 与 tdesign-vue-next）。');
          return;
        }
        var self = this;
        var jobs = LANGS.map(function (l) {
          var url = 'locales/' + DIR + '/' + l.code + '.json';
          return fetch(url, { cache: 'no-cache' }).then(function (res) {
            if (!res.ok) throw new Error(l.code + '.json → HTTP ' + res.status);
            return res.json().then(function (json) { return flatten(json, '', {}); },
              function () { throw new Error(l.code + '.json 不是合法 JSON'); });
          });
        });
        Promise.all(jobs).then(function (all) {
          var byLang = {};
          LANGS.forEach(function (l, i) { byLang[l.code] = all[i]; });
          var keys = Object.keys(byLang[SRC] || {});
          var rows = keys.map(function (k) {
            var row = { __key: k };
            LANGS.forEach(function (l) {
              if (l.code === SRC) row[l.code] = byLang[SRC][k];
              else row[l.code] = byLang[l.code] && Object.prototype.hasOwnProperty.call(byLang[l.code], k) ? byLang[l.code][k] : undefined;
            });
            return row;
          });
          self.rows = rows;
          self.statsText = statsOf(rows);
          self.loading = false;
        }).catch(function (e) {
          self.fail('词条加载失败：' + (e && e.message ? e.message : '未知错误'));
        });
      }
    },
    mounted: function () {
      this.load();
      var self = this;
      document.addEventListener('keydown', function (e) {
        var tag = (e.target && e.target.tagName ? e.target.tagName : '').toLowerCase();
        if (e.key === '/' && tag !== 'input' && tag !== 'textarea') {
          e.preventDefault();
          self.focusSearch();
        } else if (e.key === 'Escape' && self.q) {
          self.q = '';
        }
      });
    }
  });

  app.use(TDesign);
  app.mount('#app');
})();
</script>
</body>
</html>
