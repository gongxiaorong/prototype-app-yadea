<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>雅迪换电系统 · 用户端 + 商户端（外框架脚手架）</title>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/vue@3/dist/vue.global.prod.js'"></script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.js"></script>

<style id="layer-swap">
:root{--bg:#F6F7F9;--surface:#FFFFFF;--fg:#111111;--muted:#999999;--border:#E5E5E5;--accent:#2B3F5F;--accent-2:#FF6A00;--success:#17A34A;--danger:#DC2626;--link:#2F6FEB;--font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',system-ui,sans-serif;--font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{margin:0;background:#E8EAED;color:#111;-webkit-font-smoothing:antialiased;font-family:var(--font-body)}
/* ── 宿主外壳（与 index.html 一致） ── */
#host-bar{position:sticky;top:0;z-index:9000;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 18px;padding:10px 16px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);box-sizing:border-box;border-bottom:1px solid #E2E4E8}
#host-bar .modes{display:flex;gap:6px}
#host-bar .modes button,#host-bar .cur button{border:1px solid #D3D6DB;background:#fff;color:#555;padding:5px 14px;border-radius:8px;font-size:12px;cursor:pointer;transition:all .15s}
#host-bar .modes button.active,#host-bar .cur button.active{background:#2B3F5F;border-color:#2B3F5F;color:#fff;font-weight:600}
#root-user [data-cp]{cursor:pointer}
#root-user [data-cp] *{cursor:pointer}
#root-merchant [data-cp]{cursor:pointer}
#root-merchant [data-cp] *{cursor:pointer}
#host-bar .cur{display:flex;align-items:center;gap:6px}
#host-bar .cur .cur-lbl{font-size:12px;color:#8B8B95;margin-right:2px}
#host-bar .cur button{padding:3px 12px}
#host-bar .cur button.sysnav{background:#2B3F5F;border-color:#2B3F5F;color:#fff;font-weight:600}
#host-main{display:flex;align-items:stretch;overflow-x:auto;padding:24px;box-sizing:border-box;min-height:calc(100vh - 60px)}
.host-stage{display:flex;align-items:stretch;gap:16px;margin-inline:auto;max-width:100%}
#root-user,#root-merchant{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}
body.host-single-u #root-merchant{display:none}
body.host-single-m #root-user{display:none}
/* ── 每端 od-stage：iPhone 框架 + 原型操作面板并列（与 index.html 一致） ── */
.od-stage{display:flex;align-items:stretch;justify-content:center;gap:32px;max-width:100%}
.demo-ops-stack{position:relative;width:280px;min-width:280px;flex-shrink:0;align-self:center;height:852px}
.demo-ops{position:absolute;inset:0;box-sizing:border-box;max-height:852px;overflow-y:auto;visibility:hidden;pointer-events:none}
.demo-ops.is-active{background:#fff;border:1px solid #E5E5E5;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);visibility:visible;pointer-events:auto;z-index:1}
.demo-ops-title{font-size:20px;font-weight:600;color:#111;letter-spacing:.02em;margin-bottom:14px}
.demo-ops-label{font-size:12px;font-weight:600;color:#6B6B6B;margin-bottom:8px}
.demo-ops-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.demo-ops-chip{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #E5E5E5;background:#fff;color:#666;transition:background .15s,border-color .15s,color .15s,opacity .15s;user-select:none}
.demo-ops-chip:hover{background:#F6F7F9}
.demo-ops-chip.is-on{background:var(--link);border-color:var(--link);color:#fff}
.demo-ops-chip.is-off{opacity:.55;text-decoration:line-through}
/* ── iPhone 内层组件基础样式 ── */
.od-head{display:flex;align-items:center;gap:10px;padding:56px 16px 12px;background:var(--surface);border-bottom:1px solid #E5E5E5;flex:0 0 auto}
.od-head .tt{font-size:17px;font-weight:600;color:#111;flex:1}
.gear{border:none;background:none;color:var(--accent);cursor:pointer;padding:2px}
.od-body{flex:1;overflow-y:auto;padding:16px;background:var(--bg)}
.od-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.od-empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.9;padding:48px 0}
.od-btn{display:block;width:100%;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;background:#F1F3F6;color:#333}
.od-nav{display:flex;border-top:1px solid #F0F0F0;background:var(--surface)}
.od-nav .nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;color:#8B8B95;font-size:11px;cursor:pointer}
.od-nav .nv.on{color:#FF6A00}
/* ── 换电用户端 · 地图首页 ── */
.sw-map{position:absolute;inset:0;background-color:#EAEFE7}
.sw-map .road-h,.sw-map .road-v{position:absolute;background:rgba(255,255,255,.6)}
.sw-map .road-h{height:14px;left:0;right:0}
.sw-map .road-v{width:14px;top:0;bottom:0}
.sw-maplbl{position:absolute;font-size:9px;color:#6B7A66;background:rgba(255,255,255,.85);border-radius:3px;padding:1px 4px;white-space:nowrap;font-weight:500}
.sw-loc{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.sw-loc .dot{width:14px;height:14px;border-radius:50%;background:#2F6FEB;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);position:relative}
.sw-loc .dot::before{content:'';position:absolute;inset:-9px;border-radius:50%;border:1.5px solid rgba(47,111,235,.35)}
.sw-loc .tag{position:absolute;top:-19px;left:50%;transform:translateX(-50%);background:#2F6FEB;color:#fff;font-size:9px;padding:1px 6px;border-radius:8px;white-space:nowrap;font-weight:600}
.sw-station{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:pointer;transform:translate(-50%,-50%)}
.sw-station .pin{position:relative;width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.sw-station .pin.on{background:#17A34A}
.sw-station .pin.off{background:#AAB3AA}
.sw-station .pin .num{position:absolute;right:-5px;top:-5px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:#fff;border:1px solid #17A34A;color:#17A34A;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sw-station .pin.off .num{border-color:#8A938A;color:#8A938A}
.sw-station .agg{width:40px;height:40px;border-radius:50%;background:#12963E;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.sw-station .cap{font-size:9px;color:#5C695C;background:rgba(255,255,255,.85);border-radius:7px;padding:0 5px;margin-top:3px;white-space:nowrap;font-weight:500}
.sw-map-ctrl{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:20}
.sw-map-ctrl button{width:34px;height:34px;border-radius:10px;background:#fff;border:none;box-shadow:0 1px 5px rgba(0,0,0,.15);color:#455A4C;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sw-scan{position:absolute;left:0;right:0;bottom:101px;z-index:30;display:flex;justify-content:center}
.sw-scan button{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 34px;border-radius:16px;background:linear-gradient(135deg,#2B3F5F,#22324A);color:#fff;font-size:16px;font-weight:700;border:none;box-shadow:0 8px 20px rgba(43,63,95,.35);cursor:pointer}
.sw-search{position:absolute;left:12px;right:12px;top:50px;z-index:25;display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer}
/* ── 底部 Tab（对齐租车系统 tabbar：83px 白底毛玻璃 + 底部 Home 指示条） ── */
.sw-tab-nav{position:absolute;left:0;right:0;bottom:0;height:83px;z-index:100;display:flex;padding-bottom:22px;border-top:1px solid #E5E5E5;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.sw-tab-nav .nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;user-select:none;-webkit-user-select:none}
.sw-homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:135px;height:5px;border-radius:999px;background:rgba(0,0,0,.3);z-index:2001}
/* 切换换电区域后重新加载数据 */
@keyframes sw-spin{to{transform:rotate(360deg)}}
.sw-spin{animation:sw-spin .8s linear infinite}
.set-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.set-row .ic{width:34px;height:34px;border-radius:10px;background:#EBF1FD;display:flex;align-items:center;justify-content:center}
.set-row .lb{flex:1;font-size:14px;font-weight:600;color:var(--fg)}
.set-row .sc{font-size:12px;color:var(--muted)}
/* ── 登录 / 我的 · 复刻租车系统 index.html ── */
.hide-scroll::-webkit-scrollbar{display:none}
.hide-scroll{scrollbar-width:none}
.demo-ops-group-hd{font-size:12px;font-weight:700;color:#333;margin:14px 0 8px}
.demo-ops-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.demo-ops-link{font-size:11px;font-weight:600;color:var(--link);cursor:pointer;user-select:none}
.demo-ops-link:active{opacity:.7}
.demo-ops-perm-g{margin-bottom:10px}
.demo-ops-perm-g:last-child{margin-bottom:0}
.demo-ops-chip-code{margin-left:4px;font-size:9px;font-weight:400;color:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.demo-ops-chip-copy{margin-left:3px;display:inline-flex;align-items:center;opacity:.55;cursor:pointer;transition:opacity .15s}
.demo-ops-chip-copy:hover{opacity:1}
.demo-ops-chip.is-on-ok{background:var(--link);border-color:var(--link);color:#fff}
.demo-ops-chip.is-on-warn{background:var(--link);border-color:var(--link);color:#fff}
.demo-ops-section+.demo-ops-section{margin-top:4px;padding-top:12px;border-top:1px solid #E5E5E5}
.login-field{box-sizing:border-box;min-height:48px;background:#F7F8FA;border:1px solid #EBEDF0;border-radius:12px;box-shadow:none;outline:none}
.login-field input,.login-field select{box-sizing:border-box;border:0!important;outline:none!important;box-shadow:none!important;background:transparent!important;-webkit-appearance:none;appearance:none;width:100%}
.login-field-dial{min-width:5.5rem;padding:0 12px;gap:4px;cursor:pointer;flex-shrink:0}
.login-field-dial:active{background:#EEE}
.form-card{background:#fff;border:1px solid #E5E5E5;border-radius:12px;padding:16px 16px 8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.form-card .form-row{margin-bottom:16px}
.form-card .form-row:last-child{margin-bottom:8px}
.form-card .form-label{font-size:13px;font-weight:500;color:#6B6B6B;margin-bottom:6px}
.form-card .form-actions{margin:4px 0 8px}
.login-code-btn{border:none;min-width:7.25rem;min-height:48px;background:#F0F1F3;color:#9CA3AF;border-radius:12px;transition:background .15s,color .15s}
.login-code-btn.is-cd{background:#F5F6F8;color:#6B6B6B}
.login-code-btn:disabled,.login-code-btn.is-off{background:#F0F1F3;color:#9CA3AF;cursor:not-allowed}
.login-code-btn.is-on{background:#EBF1FD;color:#333}
.login-lang-chip{display:inline-flex;align-items:center;gap:4px;max-width:8.5rem;height:2.25rem;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:600;color:#111;background:#F5F6F8;cursor:pointer;transition:background .15s}
.login-lang-chip:active{background:#EBECEF}
.login-cb{width:18px;height:18px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1.5px solid #D0D0D0;background:#fff;transition:all .15s;margin-top:1px}
.login-cb.on{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.login-link{color:var(--accent-2);font-weight:500}
.login-submit{width:100%;padding:14px 16px;border-radius:12px;font-size:16px;font-weight:700;border:none;transition:background .15s,color .15s,opacity .15s}
.login-submit.is-on{background:var(--accent);color:#fff;cursor:pointer}
.login-submit.is-on:active{background:#1847A8}
.login-submit.is-off{background:#E8E8EC;color:#A0A0A8;cursor:not-allowed}
.login-switch-primary{color:var(--link);font-weight:600;font-size:14px;cursor:pointer}
.login-switch-sec{display:inline-flex;align-items:center;gap:5px;color:#6B6B6B;font-size:13px;cursor:pointer}
.login-switch-sec:active{opacity:.7}
.login-clear{width:20px;height:20px;border-radius:9999px;background:#D8D8DC;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.login-brand-mark{width:4.5rem;height:4.5rem;border-radius:1.25rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--accent) 0%,var(--accent) 100%);box-shadow:0 8px 20px rgba(43,63,95,.28);color:#fff}
.form-hint{font-size:12px;color:var(--danger);margin-top:4px}
.set-hd{font-size:13px;font-weight:500;color:#999;margin-bottom:8px;padding-left:4px}
/* ── 四块的过渡动画与滚动类（copy from index.html） ── */
.fd-enter-active,.fd-leave-active{transition:opacity .25s}
.fd-enter-from,.fd-leave-to{opacity:0}
.sl-enter-active,.sl-leave-active{transition:transform .28s cubic-bezier(.32,.72,0,1)}
.sl-enter-from,.sl-leave-to{transform:translateX(100%)}
.hid::-webkit-scrollbar{display:none}
.hid{scrollbar-width:none}
.card-actions{display:flex;border-top:1px solid #E5E5E5;margin-top:0}
.card-action-btn{flex:1;padding:10px 0;font-size:13px;font-weight:600;text-align:center;cursor:pointer;user-select:none;transition:opacity .15s}
.card-action-btn:active{opacity:.8}
.card-action-btn + .card-action-btn{border-left:1px solid #E5E5E5}
/* ── Toast（与 index.html 一致：手机内毛玻璃圆角提示） ── */
.toast-wrap{position:absolute;top:50px;left:16px;right:16px;z-index:99999;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.toast-item{padding:10px 20px;border-radius:12px;font-size:14px;font-weight:500;color:#fff;pointer-events:auto;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:center;max-width:80%;line-height:1.4}
.toast-success,.toast-error,.toast-info,.toast-warn{background:rgba(23,163,74,.9)}
.toast-enter-active{transition:all .3s cubic-bezier(.32,.72,0,1)}
.toast-leave-active{transition:all .25s ease-in}
.toast-enter-from{opacity:0;transform:translateY(-20px) scale(.9)}
.toast-leave-to{opacity:0;transform:translateY(-10px) scale(.95)}
/* ── 运行时任意值工具类兜底（@unocss/runtime 不动态生成 arbitrary 值，故此显式补齐，保证与 index.html(build 内联) 观感一致） ── */
.font-normal{font-weight:400}.font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}.tabular-nums{font-variant-numeric:tabular-nums}
.text-\[9px\]{font-size:9px}.text-\[10px\]{font-size:10px}.text-\[11px\]{font-size:11px}.text-\[12px\]{font-size:12px}.text-\[13px\]{font-size:13px}.text-\[14px\]{font-size:14px}.text-\[15px\]{font-size:15px}.text-\[16px\]{font-size:16px}.text-\[17px\]{font-size:17px}.text-\[18px\]{font-size:18px}.text-\[22px\]{font-size:22px}
.text-\[\#111\]{color:#111}.text-\[\#222\]{color:#222}.text-\[\#333\]{color:#333}.text-\[\#666\]{color:#666}.text-\[\#999\]{color:#999}.text-\[\#6B6B6B\]{color:#6B6B6B}.text-\[\#CCC\]{color:#CCC}.text-\[\#8A9999\]{color:#8A9999}.text-\[\#455A4C\]{color:#455A4C}.text-\[\#5C695C\]{color:#5C695C}.text-\[\#2B3F5F\]{color:#2B3F5F}.text-\[\#4A7CF7\]{color:#4A7CF7}.text-\[\#17A34A\]{color:#17A34A}.text-\[\#DC2626\]{color:#DC2626}.text-\[\#FF6A00\]{color:#FF6A00}.text-\[\#FF8A00\]{color:#FF8A00}.text-\[\#1A82F4\]{color:#1A82F4}.text-\[\#8B8B95\]{color:#8B8B95}.text-\[\#2F6FEB\]{color:#2F6FEB}.text-\[\#9CA3AF\]{color:#9CA3AF}
.bg-\[\#E8F0FE\]{background-color:#E8F0FE}.bg-\[\#F6F7F9\]{background-color:#F6F7F9}.bg-\[\#E5E5E5\]{background-color:#E5E5E5}.bg-\[\#FFF4E6\]{background-color:#FFF4E6}.bg-\[\#FEF2F2\]{background-color:#FEF2F2}.bg-\[\#F0FDF4\]{background-color:#F0FDF4}.bg-\[\#EBF1FD\]{background-color:#EBF1FD}.bg-\[\#FFE0B8\]{background-color:#FFE0B8}.bg-\[\#FFF3E0\]{background-color:#FFF3E0}.bg-\[\#E8F7EE\]{background-color:#E8F7EE}.bg-\[\#EEF4FF\]{background-color:#EEF4FF}.bg-\[\#EAEFE7\]{background-color:#EAEFE7}.bg-\[\#F0F0F0\]{background-color:#F0F0F0}.bg-\[\#FFF\]{background-color:#fff}

<body>
<header id="host-bar">
  <div class="modes">
    <button data-mode="split" class="active">双端并排</button>
    <button data-mode="single-u">用户端</button>
    <button data-mode="single-m">商户端</button>
  </div>
  <div class="cur">
    <span class="cur-lbl">货币</span>
    <button data-currency="CNY">人民币</button>
    <button data-currency="IDR" class="active">印尼盾</button>
    <button data-currency="HKD">港币</button>
  </div>
</header>
<main id="host-main">
  <div class="host-stage">
    <section id="root-user"></section>
    <section id="root-merchant"></section>
  </div>
</main>

<script>
/* ===== 共享货币 ===== */
var MONEY=window.MONEY=Vue.reactive({cur:'IDR',sym:{CNY:'¥',IDR:'Rp',HKD:'HK$'}});
