<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>雅迪换电系统 · 用户端 + 商户端（外框架脚手架）</title>
<!--
  ═══════════════════════════════════════════════════════════════
  雅迪换电系统 · 单文件双 App 外框架脚手架
  与租车系统(index.html)技术栈 + iOS 外壳 + 布局完全一致
  （Vue3 + UnoCSS + lucide + iPhone 393×852 框架/灵动岛/设计变量 +
   每端内嵌 280px「原型操作」面板）。
  仅搭建基础外框架，业务页占位，后续填充。
  ═══════════════════════════════════════════════════════════════
-->
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/vue@3/dist/vue.global.prod.js'"></script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.js"></script>

<style id="layer-swap">
:root{--bg:#F6F7F9;--surface:#FFFFFF;--fg:#111111;--muted:#999999;--border:#E5E5E5;--accent:#2B3F5F;--accent-2:#FF6A00;--success:#17A34A;--danger:#DC2626;--link:#2F6FEB}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{margin:0;background:#E8EAED;color:#111;-webkit-font-smoothing:antialiased;font-family:-apple-system,"PingFang SC","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
/* ── 宿主外壳（与 index.html 一致） ── */
#host-bar{position:sticky;top:0;z-index:9000;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 18px;padding:10px 16px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);box-sizing:border-box;border-bottom:1px solid #E2E4E8}
#host-bar .modes{display:flex;gap:6px}
#host-bar .modes button,#host-bar .cur button{border:1px solid #D3D6DB;background:#fff;color:#555;padding:5px 14px;border-radius:8px;font-size:12px;cursor:pointer;transition:all .15s}
#host-bar .modes button.active,#host-bar .cur button.active{background:#2B3F5F;border-color:#2B3F5F;color:#fff;font-weight:600}
#root-user [data-cp]{cursor:pointer}
#root-user [data-cp] *{cursor:pointer}
#root-merchant [data-cp]{cursor:pointer}
#root-merchant [data-cp] *{cursor:pointer}
#host-bar .cur{display:flex;align-items:center;gap:6px}
#host-bar .cur .cur-lbl{font-size:12px;color:#8B8B95;margin-right:2px}
#host-bar .cur button{padding:3px 12px}
#host-bar .cur button.sysnav{background:#2B3F5F;border-color:#2B3F5F;color:#fff;font-weight:600}
#host-main{display:flex;align-items:stretch;overflow-x:auto;padding:24px;box-sizing:border-box;min-height:calc(100vh - 60px)}
.host-stage{display:flex;align-items:stretch;gap:16px;margin-inline:auto;max-width:100%}
#root-user,#root-merchant{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}
body.host-single-u #root-merchant{display:none}
body.host-single-m #root-user{display:none}
/* ── 每端 od-stage：iPhone 框架 + 原型操作面板并列（与 index.html 一致） ── */
.od-stage{display:flex;align-items:stretch;justify-content:center;gap:32px;max-width:100%}
.demo-ops-stack{position:relative;width:280px;min-width:280px;flex-shrink:0;align-self:center;height:852px}
.demo-ops{position:absolute;inset:0;box-sizing:border-box;max-height:852px;overflow-y:auto;visibility:hidden;pointer-events:none}
.demo-ops.is-active{background:#fff;border:1px solid #E5E5E5;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);visibility:visible;z-index:1}
.demo-ops-title{font-size:20px;font-weight:600;color:#111;letter-spacing:.02em;margin-bottom:14px}
.demo-ops-label{font-size:12px;font-weight:600;color:#6B6B6B;margin-bottom:8px}
.demo-ops-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.demo-ops-chip{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #E5E5E5;background:#fff;color:#666;transition:background .15s,border-color .15s,color .15s,opacity .15s;user-select:none}
.demo-ops-chip:hover{background:#F6F7F9}
.demo-ops-chip.is-on{background:var(--link);border-color:var(--link);color:#fff}
.demo-ops-chip.is-off{opacity:.55;text-decoration:line-through}
/* ── iPhone 内层组件基础样式 ── */
.od-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);border-bottom:1px solid #F0F0F0;flex:0 0 auto}
.od-head .tt{font-size:16px;font-weight:700;color:var(--fg);flex:1}
.gear{border:none;background:none;color:var(--accent);cursor:pointer;padding:2px}
.od-body{flex:1;overflow-y:auto;padding:16px;background:var(--bg)}
.od-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.od-empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.9;padding:48px 0}
.od-btn{display:block;width:100%;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;background:#F1F3F6;color:#333}
.od-nav{display:flex;border-top:1px solid #F0F0F0;background:var(--surface)}
.od-nav .nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;color:#8B8B95;font-size:11px;cursor:pointer}
.od-nav .nv.on{color:var(--accent)}
.set-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.set-row .ic{width:34px;height:34px;border-radius:10px;background:#EBF1FD;display:flex;align-items:center;justify-content:center}
.set-row .lb{flex:1;font-size:14px;font-weight:600;color:var(--fg)}
.set-row .sc{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header id="host-bar">
  <div class="modes">
    <button data-mode="split" class="active">双端并排</button>
    <button data-mode="single-u">换电用户端</button>
    <button data-mode="single-m">换电商户端</button>
  </div>
  <div class="cur">
    <span class="cur-lbl">货币</span>
    <button data-currency="CNY">人民币</button>
    <button data-currency="IDR" class="active">印尼盾</button>
    <button data-currency="HKD">港币</button>
  </div>
  <div class="cur">
    <button data-navhost="index.html" class="sysnav">租车系统 ›</button>
  </div>
</header>
<main id="host-main">
  <div class="host-stage">
    <section id="root-user"></section>
    <section id="root-merchant"></section>
  </div>
</main>

<script>
/* ===== 共享货币 ===== */
var MONEY=window.MONEY=Vue.reactive({cur:'IDR',sym:{CNY:'¥',IDR:'Rp',HKD:'HK$'}});
var RATES={CNY:1,IDR:2175,HKD:1.09};
function fmtRp(n,dec){if(n==null||n===''||n===null)return'—';var v=Number(n)||0;try{return MONEY.sym[MONEY.cur]+' '+v.toLocaleString('en-US',{minimumFractionDigits:dec==null?0:dec,maximumFractionDigits:dec==null?0:dec})}catch(e){return MONEY.sym[MONEY.cur]+' '+v}}
function luci(name,cls){try{var L=window.lucide&&lucide.icons&&lucide.icons[name];return L?L.toSvg({width:'1em',height:'1em',class:cls||''}):'<span>◆</span>'}catch(e){return'<span>◆</span>'} }
function toastPush(msg){window.__toast&&window.__toast(msg)}
(function(){var t=document.createElement('div');t.style.cssText='position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:99999;background:#333;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none';document.body.appendChild(t);window.__toast=function(m){t.textContent=m;t.style.opacity='1';clearTimeout(t._tm);t._tm=setTimeout(function(){t.style.opacity='0'},1600)}})();

/* ===== 宿主逻辑 ===== */
function hostSetMode(m){document.body.className='host-'+m;document.querySelectorAll('#host-bar .modes button').forEach(function(b){b.classList.toggle('active',b.dataset.mode===m)})}
function hostSetCurrency(c){MONEY.cur=c;document.querySelectorAll('#host-bar [data-currency]').forEach(function(b){b.classList.toggle('active',b.dataset.currency===c)})}
document.getElementById('host-bar').addEventListener('click',function(e){
  var bm=e.target.closest&&e.target.closest('button[data-mode]');if(bm){hostSetMode(bm.dataset.mode);return}
  var bc=e.target.closest&&e.target.closest('button[data-currency]');if(bc)hostSetCurrency(bc.dataset.currency)
  var bn=e.target.closest&&e.target.closest('button[data-navhost]');if(bn)location.href=bn.dataset.navhost
});

/* ===== iPhone 外壳（与 index.html 完全一致） ===== */
var FRAME_TOP='<div class="w-[393px] h-[852px] bg-black rounded-[55px] p-3 relative shrink-0" style="box-shadow:0 0 0 2px #333,0 30px 60px rgba(0,0,0,.35)">'
 +'<div class="absolute top-[23px] left-1/2 -translate-x-1/2 w-[126px] h-[37px] bg-black rounded-[20px] z-[2000]"></div>'
 +'<div class="w-full h-full bg-[#F6F7F9] rounded-[44px] overflow-hidden flex flex-col relative">';
var FRAME_BOT='</div></div>';

/* ===== 系统设置块（含切换系统 → 租车系统） ===== */
function settingsBlock(realm){
  return '<div v-if="settingsOpen" class="od-head"><button class="od-btn" style="width:auto;padding:8px 14px;font-size:13px" @click="settingsOpen=false">‹ 返回</button><span class="tt" style="margin-left:10px">系统设置</span></div>'
   +'<div v-if="settingsOpen" class="od-body">'
   +'<div class="set-row" @click="clearData"><div class="ic" v-html="luci(\'trash-2\',\'w-5 h-5\')"></div><div class="lb">清除本机数据</div><div class="sc">重置演示状态</div></div>'
   +'<div class="set-row" @click="goRental" :style="{borderColor:\'#FFE0B8\'}"><div class="ic" style="background:#FFF3E0" v-html="luci(\'repeat\',\'w-5 h-5\')"></div><div class="lb">切换系统</div><div class="sc">前往租车系统 ›</div></div>'
   +'<div class="od-card" style="margin-top:6px;font-size:12px;line-height:1.8">当前侧：'+realm+'<br>切换系统将跳转到另一个 html，不携带任何数据（全新会话）。</div>'
   +'</div>';
}
function sideSetup(realm){return {realm:realm,goRental:function(){location.href='index.html'},clearData:function(){toastPush('演示数据已重置')},luci,fmtRp,MONEY}}

/* 原型操作面板通告：一组 chips */
function chipGroup(field,label,opts){var h=`<div class="demo-ops-section"><div class="demo-ops-label">${label}</div><div class="demo-ops-chips">`;opts.forEach(function(o){var v=(typeof o.v==='number'?String(o.v):"'" + o.v + "'");h+=`<div class="demo-ops-chip" data-cp :class="dg.${field}===${v}?'is-on':''" @click="dg.${field}=${v}" data-page-node-id="Sp-${field}-${o.v}">${o.l}</div>`});h+=`</div></div>`;return h}

/* ===== 换电用户端 ===== */
Vue.createApp({
  setup:function(){
    var tab=Vue.ref('home'),settingsOpen=Vue.ref(false);
    var dg=Vue.reactive({bal:'mid',batt:2});
    function setTab(t){tab.value=t}
    return Object.assign({tab,setTab,settingsOpen,dg},sideSetup('换电用户端'))
  },
  template:'<div class="od-stage">'
    +FRAME_TOP
    +'<div class="od-head"><span class="tt">换电系统 · 用户端</span><button class="gear" data-cp @click="settingsOpen=true" v-html="luci(\'settings\',\'w-5 h-5\')"></button></div>'
    +settingsBlock('换电用户端')
    +'<div v-if="!settingsOpen" class="od-body">'
    +'<div class="od-card" style="margin-bottom:12px"><div style="font-size:13px;color:var(--muted);margin-bottom:6px">当前余额</div><div style="font-size:22px;font-weight:800;color:var(--fg)">{{ dg.bal===\'low\'?fmtRp(5000):fmtRp(dg.bal===\'high\'?520000:128000) }}</div></div>'
    +'<div class="od-empty">【外框架】换电用户端<br>换电柜扫码 / 电池资产 / 订单等功能待填充</div>'
    +'<button class="od-btn" @click="goRental">切换至租车系统</button>'
    +'</div>'
    +'<div v-if="!settingsOpen" class="od-nav">'
    +'<div class="nv" :class="tab===\'home\'?\'on\':\'\'" @click="setTab(\'home\')"><span v-html="luci(\'home\',\'w-5 h-5\')"></span>首页</div>'
    +'<div class="nv" :class="tab===\'a\'?\'on\':\'\'" @click="setTab(\'a\')"><span v-html="luci(\'zap\',\'w-5 h-5\')"></span>换电</div>'
    +'<div class="nv" :class="tab===\'b\'?\'on\':\'\'" @click="setTab(\'b\')"><span v-html="luci(\'clipboard-list\',\'w-5 h-5\')"></span>订单</div>'
    +'<div class="nv" :class="tab===\'mine\'?\'on\':\'\'" @click="setTab(\'mine\')"><span v-html="luci(\'user\',\'w-5 h-5\')"></span>我的</div>'
    +'</div>'
    +FRAME_BOT
    +'<div class="demo-ops-stack"><div class="demo-ops is-active"><div class="demo-ops-title">原型操作</div>'
    +'<div class="demo-ops-label" style="color:#999;font-size:12px;margin-bottom:12px">换电用户端 · 演示</div>'
    +chipGroup('bal','余额',[{v:'low',l:'低'},{v:'mid',l:'中'},{v:'high',l:'高'}])
    +chipGroup('batt','电池数',[{v:0,l:'0'},{v:1,l:'1'},{v:2,l:'2'}])
    +'</div></div>'
    +'</div>'
}).mount(document.getElementById('root-user'));

/* ===== 换电商户端 ===== */
Vue.createApp({
  setup:function(){
    var tab=Vue.ref('home'),settingsOpen=Vue.ref(false);
    var dg=Vue.reactive({cab:'on',rev:'full'});
    function setTab(t){tab.value=t}
    return Object.assign({tab,setTab,settingsOpen,dg},sideSetup('换电商户端'))
  },
  template:'<div class="od-stage">'
    +FRAME_TOP
    +'<div class="od-head"><span class="tt">换电系统 · 商户端</span><button class="gear" data-cp @click="settingsOpen=true" v-html="luci(\'settings\',\'w-5 h-5\')"></button></div>'
    +settingsBlock('换电商户端')
    +'<div v-if="!settingsOpen" class="od-body">'
    +'<div class="od-card" style="margin-bottom:12px"><div style="font-size:13px;color:var(--muted);margin-bottom:6px">运营概况</div><div style="font-size:22px;font-weight:800;color:var(--fg)">{{ dg.cab===\'off\'?fmtRp(0):fmtRp(68000) }}</div></div>'
    +'<div class="od-empty">【外框架】换电商户端<br>换电柜管理 / 电池调度 / 运营看板等功能待填充</div>'
    +'<button class="od-btn" @click="goRental">切换至租车系统</button>'
    +'</div>'
    +'<div v-if="!settingsOpen" class="od-nav">'
    +'<div class="nv" :class="tab===\'home\'?\'on\':\'\'" @click="setTab(\'home\')"><span v-html="luci(\'home\',\'w-5 h-5\')"></span>首页</div>'
    +'<div class="nv" :class="tab===\'a\'?\'on\':\'\'" @click="setTab(\'a\')"><span v-html="luci(\'box\',\'w-5 h-5\')"></span>换电柜</div>'
    +'<div class="nv" :class="tab===\'b\'?\'on\':\'\'" @click="setTab(\'b\')"><span v-html="luci(\'battery-charging\',\'w-5 h-5\')"></span>电池</div>'
    +'<div class="nv" :class="tab===\'mine\'?\'on\':\'\'" @click="setTab(\'mine\')"><span v-html="luci(\'bar-chart-3\',\'w-5 h-5\')"></span>看板</div>'
    +'</div>'
    +FRAME_BOT
    +'<div class="demo-ops-stack"><div class="demo-ops is-active"><div class="demo-ops-title">原型操作</div>'
    +'<div class="demo-ops-label" style="color:#999;font-size:12px;margin-bottom:12px">换电商户端 · 演示</div>'
    +chipGroup('cab','换电柜',[{v:'on',l:'在线'},{v:'off',l:'离线'}])
    +chipGroup('rev','营收',[{v:'full',l:'全量'},{v:'zero',l:'清零'}])
    +'</div></div>'
    +'</div>'
}).mount(document.getElementById('root-merchant'));

hostSetMode('split');
hostSetCurrency(MONEY.cur);
</script>
</body>
</html>
